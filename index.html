<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sam's DayZ Layout Tool</title>
    <link rel="stylesheet" href="./styles.css" />
    <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <aside class="panel left">
        <h1>Sam's DayZ Layout Tool</h1>
        <label class="field">
          <span>Search object</span>
          <input id="searchInput" placeholder="fuelstation, garage, fence..." />
        </label>
        <div id="objectList" class="object-list"></div>
      </aside>

      <main id="viewportWrap">
        <canvas id="viewport"></canvas>
        <div id="dropHint">Drop object to place box</div>
      </main>

      <aside class="panel right">
        <h2>Placed Objects</h2>
        <div id="placedList" class="placed-list"></div>
        <div class="right-bottom">
          <h3>Export</h3>
          <div class="row export-actions">
            <button id="exportScene" class="export-action"><span class="btn-icon">📁</span><span>Export to File</span></button>
            <button id="copyExport" class="export-action"><span class="btn-icon">📋</span><span>Copy to Clipboard</span></button>
            <label class="file-input import-large export-action">
              <span class="btn-icon">📥</span><span>Import</span>
              <input id="importScene" type="file" accept="application/json" />
            </label>
          </div>
          <h3>Camera Controls</h3>
          <p class="muted">W/S: forward/back, A/D: strafe, Q/Z: up/down, Shift: faster movement.</p>
          <p class="muted">Space: switch between camera mode and cursor mode.</p>
        </div>
      </aside>
    </div>
    <footer id="bottomToolbar">
      <div class="toolbar-left">
        <button data-mode="translate"><span class="btn-icon">✥</span><span>Move</span></button>
        <button data-mode="rotate"><span class="btn-icon">⟳</span><span>Rotate</span></button>
        <button id="deleteSelected"><span class="btn-icon">🗑</span><span>Delete</span></button>
        <button id="duplicateSelected"><span class="btn-icon">⧉</span><span>Duplicate</span></button>
        <button id="undoAction"><span class="btn-icon">↶</span><span>Undo</span></button>
        <label class="speed-control">
          Speed
          <input id="moveSpeed" type="range" min="2" max="40" step="1" value="12" />
          <span id="moveSpeedValue">12</span>
        </label>
        <label class="speed-control">
          Shift Boost
          <input id="sprintMultiplier" type="range" min="1" max="4" step="0.1" value="2.2" />
          <span id="sprintMultiplierValue">2.2x</span>
        </label>
      </div>
      <div id="statusText" class="muted toolbar-status">Ready.</div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
