<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" fill="none">
  <rect width="640" height="260" rx="12" fill="#0D1520"/>
  <rect x="12" y="12" width="616" height="236" rx="10" fill="#111D2B" stroke="#2E3A4A"/>

  <text x="28" y="44" fill="#DCE8F7" font-family="Arial, sans-serif" font-size="20" font-weight="700">Editor Controls</text>

  <g transform="translate(28,64)">
