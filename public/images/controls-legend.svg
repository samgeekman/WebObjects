      <text x="50" y="19" text-anchor="middle" fill="#DCE8F7" font-family="Arial, sans-serif" font-size="14">W</text>

      <rect x="0" y="34" width="28" height="28" rx="5" fill="#233348" stroke="#8DC2FF"/>
      <text x="14" y="53" text-anchor="middle" fill="#DCE8F7" font-family="Arial, sans-serif" font-size="14">A</text>

      <rect x="36" y="34" width="28" height="28" rx="5" fill="#233348" stroke="#8DC2FF"/>
      <text x="50" y="53" text-anchor="middle" fill="#DCE8F7" font-family="Arial, sans-serif" font-size="14">S</text>

